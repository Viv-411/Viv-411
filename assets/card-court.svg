<circle cx="90" cy="48" r="6" fill="#f5a524"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
<rect x="459.1" y="42" width="104.9" height="30" rx="15" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.5"/>
