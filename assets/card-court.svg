<rect width="600" height="310" rx="20" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="599" height="309" rx="20" fill="none" stroke="#242d42"/>
<rect x="40" y="0" width="200" height="3" fill="url(#bar)"/>
<rect x="40" y="32" width="66" height="60" rx="16" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
