<text x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a3aec4">A fair-play light for crowded pickleball</text><text x="40" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a3aec4">courts, plus an app showing wait times.</text>
